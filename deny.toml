[graph]
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill is pulled by postcard/heapless in the pinned Iroh 1.0.3 graph; no safe compatible upgrade is available" },
    { id = "RUSTSEC-2024-0436", reason = "paste is pulled by Iroh's netwatch/netlink graph; no safe compatible upgrade is available while Iroh remains pinned to 1.0.3" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = [
    { allow = ["Unlicense"], crate = "async_io_stream@0.3.3" },
    { allow = ["MPL-2.0"], crate = "attohttpc@0.30.1" },
    { allow = ["Unlicense"], crate = "pharos@0.5.3" },
    { allow = ["Unlicense"], crate = "ws_stream_wasm@0.7.5" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs@1.0.9" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots@1.0.9" },
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "simplest-path"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
